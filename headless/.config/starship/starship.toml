"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = false
scan_timeout = 500

# =============================================================================
# Core System & Host / SSH Detection
# =============================================================================

[hostname]
ssh_only = false
ssh_symbol = "󰒋 "
format = '\[[$ssh_symbol$hostname]($style)\]'
style = "bold green"

[username]
format = '\[[ $user]($style)\]'
disabled = false
show_always = true

[directory]
format = '\[[ $path]($style)\]'
style = "bold blue"

[cmd_duration]
min_time = 2000
format = '\[[󱎫 $duration]($style)\]'
style = "bold yellow"

[time]
disabled = false
format = '\[[ $time]($style)\]'
time_format = "%R"
utc_time_offset = "local"

# =============================================================================
# Git Integration
# =============================================================================

[git_branch]
symbol = " "
format = '\[[$symbol$branch]($style)\]'
style = "bold purple"

[git_commit]
format = '\[[ \($hash$tag\)]($style)\]'

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'

# =============================================================================
# Languages & Tools
# =============================================================================

[c]
symbol = " "
format = '\[[$symbol($version(-$name))]($style)\]'

[cpp]
symbol = " "
format = '\[[$symbol($version(-$name))]($style)\]'

[cmake]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[golang]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[java]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[nodejs]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[php]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[python]
symbol = " "
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'

[rust]
symbol = "󱘗 "
format = '\[[$symbol($version)]($style)\]'

[lua]
symbol = " "
format = '\[[$symbol($version)]($style)\]'

[package]
symbol = "󰏗 "
format = '\[[$symbol$version]($style)\]'

