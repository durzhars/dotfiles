# =============================================================================
# Tmux Configuration — Headless Terminal Sessions
# =============================================================================

# --- Prefix & General ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm*:Tc,tmux-256color:Tc"

set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g mouse on

# Base Index 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings ---

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes with current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi mode for scroll/copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-lines -X begin-selection
bind-key -T copy-mode-vi y send-lines -X copy-selection-and-cancel

# --- Status Bar & Aesthetics ---
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181c23,fg=#dde2f3"

# Left Status (Session Name)
set -g status-left-length 30
set -g status-left "#[fg=#181c23,bg=#8b32ab,bold] 󰒋 #S #[bg=#181c23,fg=#8b32ab]"

# Right Status (Host & Clock)
set -g status-right-length 100
set -g status-right "#[fg=#aec7fd,bg=#181c23]  #(whoami)@#h #[fg=#455e8e,bg=#181c23]  %H:%M %d-%b-%y "

# Window Status Formatting
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#727785,bg=#181c23] #I:#W "
setw -g window-status-current-format "#[fg=#181c23,bg=#aec7fd,bold] #I:#W #[bg=#181c23,fg=#aec7fd]"

# Pane Borders
set -g pane-border-style "fg=#727785"
set -g pane-active-border-style "fg=#8b32ab"
